# Noctex · entorno de pruebas local (NO es la configuración de producción)
#   docker compose -f noctex-dev/compose.yaml up -d   →  http://localhost:8080
# Solo escucha en 127.0.0.1. Usa la imagen construida con:
#   cd server-ce && make build-base build-community \
#     OVERLEAF_BASE_TAG=noctex/sharelatex-base:local OVERLEAF_TAG=noctex/sharelatex:local
name: noctex-dev
services:
  sharelatex:
    image: noctex/sharelatex:local
    container_name: noctex-dev
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:8080:80"
    stop_grace_period: 60s
    volumes:
      - sharelatex_data:/var/lib/overleaf
    environment:
      OVERLEAF_APP_NAME: Noctex
      OVERLEAF_HEADER_IMAGE_URL_DARK: /noctex-logo-dark.svg
      OVERLEAF_HEADER_IMAGE_URL_LIGHT: /noctex-logo-light.svg
      # Enlace al código fuente modificado (obligatorio por la AGPL-3.0)
      OVERLEAF_RIGHT_FOOTER: '[{"text":"Código fuente de Noctex (AGPL)","url":"https://github.com/samuelstx/noctex/tree/custom"}]'
      OVERLEAF_SITE_URL: http://localhost:8080
      OVERLEAF_MONGO_URL: mongodb://mongo/sharelatex
      OVERLEAF_REDIS_HOST: redis
      REDIS_HOST: redis
      ENABLED_LINKED_FILE_TYPES: "project_file,project_output_file"
      ENABLE_CONVERSIONS: "true"
      EMAIL_CONFIRMATION_DISABLED: "true"
      # Solo para pruebas locales; en producción va en un .env con permisos 600
      OVERLEAF_INVITE_TOKEN_SECRET: "solo-dev-local-no-usar-en-produccion"
      # Fijo para que la sesión sobreviva a las recompilaciones (solo local)
      OVERLEAF_SESSION_SECRET: "solo-dev-local-sesion-no-usar-en-produccion"
      # CE+ activa el registro público si no se dice lo contrario
      OVERLEAF_ENABLE_REGISTRATION_PAGE: "false"
  mongo:
    image: mongo:8.0
    command: "--replSet overleaf"
    volumes:
      - mongo_data:/data/db
      - ../bin/shared/mongodb-init-replica-set.js:/docker-entrypoint-initdb.d/mongodb-init-replica-set.js:ro
    environment:
      MONGO_INITDB_DATABASE: sharelatex
    extra_hosts:
      - mongo:127.0.0.1
    healthcheck:
      test: echo 'db.stats().ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
  redis:
    image: redis:7.4
    volumes:
      - redis_data:/data

volumes:
  sharelatex_data:
  mongo_data:
  redis_data:
